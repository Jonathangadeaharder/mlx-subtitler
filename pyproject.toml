[project]
name = "mlx-subtitler"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mlx-whisper>=0.4.3",
    "pandas>=3.0.2",
    "pysrt>=1.1.2",
    "sacremoses>=0.1.1",
    "sentencepiece>=0.2.1",
    "spacy>=3.8.14",
    "tqdm>=4.67.3",
    "transformers>=5.6.2",
]

[dependency-groups]
dev = [
    "mutmut>=3.5.0",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
]

[project.scripts]
mlx-subtitler = "cli:main"
